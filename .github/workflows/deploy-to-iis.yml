name: Deploy to IIS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: win-runner-1

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Stop IIS
        run: iisreset /stop

      - name: Deploy using Robocopy
        run: robocopy . C:\inetpub\wwwroot /MIR

      - name: Start IIS
        run: iisreset /start

      - name: Done
        run: echo "Deployment completed"