name: Deploy HTML to IIS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: win-runner-1

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy index.html to IIS
        run: |
          copy /Y index.html C:\inetpub\wwwroot\index.html

      - name: Done
        run: echo "HTML deployed to IIS successfully"